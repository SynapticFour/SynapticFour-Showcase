name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: showcase-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This job is the fixture spine: syntax, unit tests, honesty gates, and
# committed JSON shapes. It does **not** start Docker, Ferrum, HELIOS, or Solum.
# Live golden path is `make golden-path` on a workstation. GitHub-hosted
# `live-golden-path.yml` fails closed unless SHOWCASE_LIVE_SIBLINGS=1.

jobs:
  fixture-spine:
    name: Fixture spine (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fixture suite + honesty gates
        run: |
          ./scripts/run-integration-suite.sh --fixtures --publish-verification
          test -f demo/verification/MANIFEST.json
          test -f demo/verification/SUITE-MANIFEST.json
          python3 -c "
          import json
          m=json.load(open('demo/verification/SUITE-MANIFEST.json'))
          assert m['suite_kind']=='synapticfour-showcase-integration-suite'
          assert m['mode']=='fixtures'
          assert m['summary']['ok'] is True
          print('fixture suite ok', m['summary'])
          "
