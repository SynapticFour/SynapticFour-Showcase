name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: showcase-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-suite:
    name: Integration suite (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run customer-equivalent fixture suite
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh 2>/dev/null || true
          ./scripts/run-integration-suite.sh --fixtures --publish-verification
          test -f demo/verification/MANIFEST.json
          test -f demo/verification/SUITE-MANIFEST.json
          python3 -c "
          import json
          m=json.load(open('demo/verification/SUITE-MANIFEST.json'))
          assert m['suite_kind']=='synapticfour-showcase-integration-suite'
          assert m['summary']['ok'] is True
          print('suite ok', m['summary'])
          "
