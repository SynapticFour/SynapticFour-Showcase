name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Extract into a temp dir — the release tarball ships its own README.md /
      # LICENSE and would overwrite the repo tree if unpacked in $GITHUB_WORKSPACE
      # (gitleaks' README embeds the sidekiq example secret cafebabe:deadbeef).
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          EXPECTED_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          tmp="$(mktemp -d)"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" \
            -o "$tmp/${ARCHIVE}"
          echo "${EXPECTED_SHA256}  $tmp/${ARCHIVE}" | sha256sum -c -
          tar xz -C "$tmp" -f "$tmp/${ARCHIVE}"
          sudo mv "$tmp/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmp"
          gitleaks version

      - name: Run Gitleaks (git history)
        run: gitleaks detect --source . --verbose --log-opts="--all" --config .gitleaks.toml
